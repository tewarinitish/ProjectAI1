<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Try It On</title>
<style>
:root{--bg:#f6f3ee;--surface:#fff;--ink:#1d2330;--muted:#6a7080;--line:#ddd7cc;--accent:#1f5c4d;--accent-ink:#fff;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0)}
@media (prefers-color-scheme:dark){:root{--bg:#161a22;--surface:#212733;--ink:#eef0f4;--muted:#9aa2b3;--line:#333b4b;--accent:#59b89f;--accent-ink:#0e1713;--err:#f2b8b5}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font:600 30px/1.15 Georgia,serif;margin:8px 0 6px}
.lead{margin:0 0 18px;color:var(--muted)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:200px;padding:10px;border:1.5px dashed var(--line);border-radius:14px;background:var(--surface);text-align:center;overflow:hidden}
.drop:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.drop input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.drop b{font-size:15px}.drop span{font-size:13px;color:var(--muted)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--surface)}
.drop.has{border-style:solid;border-color:var(--accent)}
.drop.has b,.drop.has span{position:relative;z-index:1;background:var(--surface);padding:2px 8px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
label{font-size:14px;font-weight:600}
select,input[type=text]{font:inherit;min-height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
button{font:inherit;font-weight:600;min-height:50px;width:100%;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.55;cursor:default}
button.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#status{margin:14px 0 0;color:var(--muted);min-height:1.5em}
#status.err{color:var(--err)}
#out{display:none;margin-top:18px}
#out img{width:100%;border-radius:14px;display:block;background:var(--surface)}
</style>
</head>
<body>
<main>
<h1>Try it on</h1>
<p class="lead">Add a photo of a person and a photo of a garment. The AI dresses the person in it.</p>

<div class="pick">
  <label class="drop" id="dP"><b>Person photo</b><span>Full body, facing front</span><input type="file" accept="image/*" id="fP"></label>
  <label class="drop" id="dG"><b>Garment photo</b><span>Plain background is best</span><input type="file" accept="image/*" id="fG"></label>
</div>

<div class="field"><label for="cat">Garment type</label>
  <select id="cat"><option value="upper_body">Top or jacket</option><option value="lower_body">Trousers or skirt</option><option value="dresses">Dress or full outfit</option></select></div>
<div class="field"><label for="des">Short description (optional)</label>
  <input type="text" id="des" maxlength="120" placeholder="e.g. red short-sleeve cotton t-shirt"></div>

<button id="go" disabled>Create</button>
<p id="status" role="status"></p>

<div id="out">
  <img id="res" alt="Generated try-on result">
  <button class="alt" id="dl">Save image</button>
</div>
</main>

<script>
const $=i=>document.getElementById(i);
let person=null,garment=null,blobUrl=null;
function pick(inp,drop,set){
  inp.addEventListener('change',()=>{
    const f=inp.files[0];if(!f)return;set(f);
    drop.querySelector('img')?.remove();
    const im=document.createElement('img');im.alt='';im.src=URL.createObjectURL(f);
    drop.appendChild(im);drop.classList.add('has');
    $('go').disabled=!(person&&garment);
  });
}
pick($('fP'),$('dP'),f=>person=f);
pick($('fG'),$('dG'),f=>garment=f);

$('go').addEventListener('click',async()=>{
  const st=$('status'),btn=$('go');
  st.className='';st.textContent='Creating your image. This takes about 20 to 60 seconds.';
  btn.disabled=true;$('out').style.display='none';
  const fd=new FormData();
  fd.append('person',person);fd.append('garment',garment);
  fd.append('category',$('cat').value);
  fd.append('description',$('des').value||'clothing');
  try{
    const r=await fetch('/api/tryon',{method:'POST',body:fd});
    if(!r.ok){let m='Something went wrong.';try{m=(await r.json()).detail||m}catch(e){}throw new Error(m)}
    const b=await r.blob();
    if(blobUrl)URL.revokeObjectURL(blobUrl);
    blobUrl=URL.createObjectURL(b);
    $('res').src=blobUrl;$('out').style.display='block';
    st.textContent='Done.';
    $('out').scrollIntoView({behavior:'smooth'});
  }catch(e){st.className='err';st.textContent=e.message+' Try again, or use a different photo.'}
  btn.disabled=false;
});
$('dl').addEventListener('click',()=>{
  const a=document.createElement('a');a.href=blobUrl;a.download='try-on.jpg';
  document.body.appendChild(a);a.click();a.remove();
});
</script>
</body>
</html>
